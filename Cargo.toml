[package]
name        = "etit-proxy"
version     = "0.2.0"
edition     = "2021"
authors     = ["Apex Transport"]
description = "Rust middleware bridging React/Google Maps to legacy ETIT ASP.NET tracking — v2"
license     = "MIT"

[dependencies]
# ---- Web framework ----------------------------------------------------------
axum       = { version = "0.7", features = ["macros", "ws"] }
tower      = { version = "0.5", features = ["util", "limit", "timeout"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip", "set-header", "request-id"] }

# ---- Async runtime ----------------------------------------------------------
tokio        = { version = "1.40", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures      = "0.3"

# ---- HTTP client ------------------------------------------------------------
reqwest = { version = "0.12", default-features = false, features = [
    "json", "default-tls", "gzip", "cookies"
] }

# ---- Persistence (SQLite via sqlx; Postgres read-only for the apex DB) -----
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-native-tls", "sqlite", "postgres", "chrono", "macros", "migrate"
] }

# ---- In-memory cache --------------------------------------------------------
moka = { version = "0.12", features = ["future"] }

# ---- Serialization ----------------------------------------------------------
serde      = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3"
serde_json = "1.0"

# ---- Time -------------------------------------------------------------------
chrono    = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# ---- Concurrency / data structures -----------------------------------------
parking_lot = "0.12"
dashmap     = "6.1"
arc-swap    = "1.7"

# ---- Utilities --------------------------------------------------------------
anyhow            = "1.0"
thiserror         = "1.0"
regex             = "1.11"
once_cell         = "1.20"
url               = "2.5"
percent-encoding  = "2.3"
uuid              = { version = "1.10", features = ["v4", "serde"] }
bytes             = "1.7"

# ---- Logging ----------------------------------------------------------------
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# ---- Config -----------------------------------------------------------------
dotenvy = "0.15"

jsonwebtoken = "9"
sentry = "0.49"
sentry-tower = { version = "0.49", features = ["http"] }
sentry-tracing = "0.49"

[dev-dependencies]
tokio = { version = "1.40", features = ["test-util", "macros", "rt-multi-thread"] }
# Enables sentry::test so the error funnel can assert what it does and does
# not export. Test-only; the shipped binary is unaffected.
sentry = { version = "0.49", features = ["test"] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true
panic         = "abort"

[profile.dev]
opt-level = 1
